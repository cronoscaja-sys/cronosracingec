
name: Compilar APK Cronos Racing

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ANDROID_STUDIO_Cronos_Racing/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verificar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar APK
        working-directory: ANDROID_STUDIO_Cronos_Racing
        run: gradle --no-daemon assembleDebug

      - name: Descargar APK
        uses: actions/upload-artifact@v4
        with:
          name: Cronos-Racing-Android-APK
          path: ANDROID_STUDIO_Cronos_Racing/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
