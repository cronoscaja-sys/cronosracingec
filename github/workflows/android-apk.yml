
name: Compilar APK Cronos Racing

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ANDROID_STUDIO_Cronos_Racing/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: ANDROID_STUDIO_Cronos_Racing

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar APK de prueba
        run: gradle --no-daemon assembleDebug

      - name: Comprobar APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK para descarga
        uses: actions/upload-artifact@v4
        with:
          name: Cronos-Racing-Android-APK
          path: ANDROID_STUDIO_Cronos_Racing/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
